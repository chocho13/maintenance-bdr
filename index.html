<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maintenance en cours — BDR Systèmes</title>
<style>
  :root { --bg:#f5f7fa; --fg:#1b2430; --muted:#5b6675; --card:#fff; --accent:#d97706; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151c; --fg:#e8edf3; --muted:#9aa6b5; --card:#18202a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:480px; background:var(--card); border-radius:16px; padding:32px 24px;
         text-align:center; box-shadow:0 2px 16px rgba(0,0,0,.08); }
  .icon { font-size:48px; }
  h1 { font-size:1.4rem; margin:.5rem 0; }
  p { color:var(--muted); margin:.5rem 0; }
  .bar { height:4px; border-radius:2px; background:var(--accent); margin:20px auto 0; width:64px; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">🛠️</div>
  <h1>Service momentanément indisponible</h1>
  <p>Nos serveurs subissent une coupure de connexion chez notre fournisseur d'accès.
     Nous travaillons au rétablissement du service.</p>
  <p>Vos données sont en sécurité. Merci de réessayer d'ici quelques instants.</p>
  <div class="bar"></div>
</main>
</body>
</html>
